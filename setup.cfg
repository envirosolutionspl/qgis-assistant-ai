[flake8]
max-line-length = 79
docstring-convention = pep257
exclude = .git,__pycache__,dist
# Test methods are named after what they check; no docstring needed.
per-file-ignores =
    tests/*: D102,D103,D107
    # Prompt text for the model: wrapping it would make it hard to edit.
    gis_assistant_ai/prompts.py: E501

[tool:pytest]
testpaths = tests
